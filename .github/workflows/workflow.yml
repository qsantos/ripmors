on:
  push:
    branches: master
  pull_request:
    branches: master

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable caching
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust stable
        run: rustup install stable
      - name: Rustfmt
        run: cargo fmt --check
      - name: Typos
        uses: crate-ci/typos@master
        with:
          files: src/
      - name: Clippy
        run: cargo clippy --tests
      - name: Tests
        run: cargo test
      - name: Build
        run: cargo build --verbose
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit
        run: cargo audit -D warnings
      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup
      - name: Miri
        run: cargo miri test

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        run: rustup toolchain install nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # GitHub runners usually lack AVX-512 VBMI2/GFNI, so this only exercises the portable code
      - name: Fuzz decoding
        run: cargo +nightly fuzz run decode -O -- -max_total_time=120 -max_len=8192
      - name: Fuzz encoding
        run: cargo +nightly fuzz run encode -O -- -max_total_time=120 -max_len=8192
