[package]
name = "ripmors"
version = "0.3.0"
authors = ["Quentin Santos <qsantos@qsantos.fr>"]
description = "ripmors is a library for encoding and decoding international Morse code and several variants"
repository = "https://github.com/qsantos/ripmors/"
license = "Apache-2.0 AND MIT"
edition = "2024"
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/build.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.4"
tango-bench = "0.9.0"

[[bench]]
name = "criterion"
harness = false

[[bench]]
name = "tango"
harness = false

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
clap = { version = "4.6.8", features = ["derive"], optional = true }
simdutf8 = "0.1.5"
libc = { version = "0.2.191", optional = true }

[features]
default = ["clap", "fast-io"]
# Binary only: memory-map the input when it is a regular file, and enlarge pipes
fast-io = ["dep:libc"]

[[bin]]
name = "ripmors"
required-features = ["clap"]

[lints.rust]
# set by cargo-fuzz; enables the hooks in `ripmors::fuzzing`
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
